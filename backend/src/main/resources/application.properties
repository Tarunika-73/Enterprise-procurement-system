# ===================================================================
# Enterprise Procurement System - Application Configuration
# Member 2 - Backend Setup
# ===================================================================

# ---- Application ----
spring.application.name=enterprise-procurement-system
server.port=8080

# ---- MySQL Database Connection ----
# NOTE: Coordinate with Member 3 (Database) on the actual schema name,
# and never commit real credentials -- override these via environment
# variables in production (see below).
spring.datasource.url=jdbc:mysql://localhost:3306/procurement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Chaitu58}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: safe for local dev, keeps tables in sync with entities.
# Once Member 3's SQL scripts are the source of truth, switch this to "validate" or "none".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Only run data.sql if you want seed data on top of Member 3's schema.
# Set to "never" once real data is present, to avoid re-seeding on every restart.
spring.sql.init.mode=never

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# ---- Logging ----
logging.level.root=INFO
logging.level.com.procurement.enterprise=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- JWT (placeholder secret; override via env var, never commit real value) ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-env-vars}
app.jwt.expiration-ms=86400000
