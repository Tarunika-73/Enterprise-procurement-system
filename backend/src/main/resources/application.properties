# ============================================================
# Application
# ============================================================
spring.application.name=Enterprise Procurement System
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Database
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_procurement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tarunika@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b80
app.jwt.expiration-ms=86400000
