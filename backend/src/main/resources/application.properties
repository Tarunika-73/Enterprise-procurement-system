# ============================================================
# Application
# ============================================================
spring.application.name=Enterprise Procurement System
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Database
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_procurement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Spring Boot's automatic data.sql / schema.sql execution
# Database is managed via database/schema.sql and database/sample_data.sql
spring.sql.init.mode=never

# ============================================================
# JWT
# ============================================================
app.jwt.secret=M2NmYTc2ZWYxNDkzN2MxYzBlYTE5MWY4ZmMwNTdhODBmY2QwNGE3NDIwZjhlOGJjZDBhNzU2N2MyNzJlMDA3Yjgw
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ============================================================
# Swagger / SpringDoc
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Logging
# ============================================================
logging.level.com.procurement.enterprise=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n